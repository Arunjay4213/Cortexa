[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cama-v2"
version = "0.1.0"
description = "Causal Attribution for Memory-Augmented generation — research prototype"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = [
    "lettucedetect>=0.1.5",
    "transformers>=4.45",
    "torch>=2.1",
    "sentence-transformers>=3.0",
]
cpu = [
    "sentence-transformers>=3.0",
]
nli = [
    "transformers>=4.45",
    "torch>=2.1",
]
bench = [
    "datasets>=3.0",
    "scikit-learn>=1.4",
    "tabulate>=0.9",
    "anthropic>=0.40",
    "openai>=1.50",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
cama-bench = "benchmarks.report:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
