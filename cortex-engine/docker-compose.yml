version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex}
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex"]
      interval: 5s
      timeout: 3s
      retries: 5

  cortex:
    build: .
    ports:
      - "8000:8000"
    environment:
      CORTEX_DATABASE_URL: "postgresql+asyncpg://cortex:${POSTGRES_PASSWORD:-cortex}@db:5432/cortex"
      CORTEX_DATABASE_URL_SYNC: "postgresql://cortex:${POSTGRES_PASSWORD:-cortex}@db:5432/cortex"
      CORTEX_ADMIN_SECRET: "${CORTEX_ADMIN_SECRET}"
      CORTEX_CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      CORTEX_LLM_PROVIDER: "${CORTEX_LLM_PROVIDER:-local}"
      CORTEX_LLM_API_KEY: "${CORTEX_LLM_API_KEY:-}"
      CORTEX_CAMA_LLM_MODEL: "${CORTEX_CAMA_LLM_MODEL:-gpt-4o-mini}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
