services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cortex
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build: ./cortex-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORTEX_DATABASE_URL: postgresql+asyncpg://cortex:${DB_PASSWORD}@postgres:5432/cortex
      CORTEX_DATABASE_URL_SYNC: postgresql://cortex:${DB_PASSWORD}@postgres:5432/cortex
      CORTEX_ADMIN_SECRET: ${ADMIN_SECRET}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
