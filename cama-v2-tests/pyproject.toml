[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cama-v2-tests"
version = "0.1.0"
description = "Hostile stress test and benchmark suite for CAMA v2 engine"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "hypothesis>=6.100",
    "scikit-learn>=1.4",
    "tabulate>=0.9",
]

[project.optional-dependencies]
bench = [
    "datasets>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["unit", "integration"]
addopts = "-v --tb=short --timeout=60"
