[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortexa"
version = "0.1.0"
description = "Memory intelligence platform for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "memory", "attribution", "rag", "ai", "ghost-tokens", "hallucination"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "anthropic>=0.40.0",
    "fastmcp>=0.4.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
nli = ["transformers>=4.40", "torch>=2.1", "optimum[onnxruntime]"]
mem0 = ["mem0ai>=0.1"]
chromadb = ["chromadb>=0.5"]
dev = ["pytest>=8.0", "pytest-asyncio"]

[project.urls]
Homepage = "https://cortexadev.com"
Documentation = "https://github.com/Arunjay4213/Cortexa"
Repository = "https://github.com/Arunjay4213/Cortexa"

[project.scripts]
cx = "cortexa.app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["cortexa"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
